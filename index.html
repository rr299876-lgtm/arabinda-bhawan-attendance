
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ARABINDA BHAWAN Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f4f8;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      background: black;
    }
    button {
      padding: 16px 25px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
  
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

</head>
<body>
  <h1>ARABINDA BHAWAN</h1>
  <h3>GIRLS STUDENT ATTENDANCE</h3>

  <video id="webcam" autoplay playsinline muted></video>
  
<div style="margin-top:20px;">
  <button type="button" onclick="testAttendance('IN')">
    IN
  </button>

  <button type="button" onclick="testAttendance('OUT')">
    OUT
  </button>
</div>

  <p id="status">Camera not started</p>

  <button onclick="startCamera()">
    Start Front Camera
  </button>

  <script>
    let singleFaceReady = false;
    async function startCamera() {
      const status = document.getElementById("status");
      const video = document.getElementById("webcam");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        await startFaceDetection();
        status.textContent = "Camera Connected Successfully";
       
      } catch (error) {
        status.textContent =
          "Camera Error: " + error.name + " - " + error.message;
      }
    }
    
function checkFaceDetection() {
  const video = document.getElementById("webcam");

  if (video && video.readyState >= 2) {
    document.getElementById("status").textContent =
      "Camera Ready - Face Detection Setup Pending";
  }
}

async function detectFaceSupport() {
  const status = document.getElementById("status");

  if ("FaceDetector" in window) {
    status.textContent = "Face Detection API Available";
  } else {
    status.textContent =
      "Face Detection API Not Available - Library Required";
  }
}

let faceDetector = null;

async function startFaceDetection() {
  const status = document.getElementById("status");

  if (typeof FaceDetection === "undefined") {
    status.textContent = "Face Detection Library Not Loaded";
    return;
  }

  try {
    faceDetector = new FaceDetection({
      locateFile: (file) =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/" + file
    });

    faceDetector.setOptions({
      model: "short",
      minDetectionConfidence: 0.6
    });



    faceDetector.onResults((results) => {
    
const faceCount = results.detections
  ? results.detections.length
  : 0;


if (faceCount === 1) {
  singleFaceReady = true;
  status.textContent = "One Face Detected - Ready";
} else if (faceCount > 1) {
  singleFaceReady = false;
  status.textContent = "Multiple Faces Detected - Wait";
} else {
  singleFaceReady = false;
  status.textContent = "No Face Detected";
}


    });

    status.textContent = "Face Detector Initialized";
    const video = document.getElementById("webcam");

async function detectFrame() {
  if (!faceDetector || video.readyState < 2) {
    return;
  }

  try {
    await faceDetector.send({ image: video });
  } catch (error) {
    status.textContent = "Detection Error: " + error.message;
    return;
  }

  setTimeout(detectFrame, 250);
}

detectFrame();
  } catch (error) {
    status.textContent = "Face Detector Error: " + error.message;
  }
}

function testAttendance(type) {
  alert("Face Ready Status: " + singleFaceReady);
  if (typeof singleFaceReady === "undefined" ||
      !singleFaceReady) {
    alert("Please show exactly one face to the camera.");
    return;
  }

  alert(type + " Attendance Test Successful");
}

  </script>
</body>
</html>
