
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ARABINDA BHAWAN Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f4f8;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      background: black;
    }
    button {
      padding: 16px 25px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>ARABINDA BHAWAN</h1>
  <h3>GIRLS STUDENT ATTENDANCE</h3>

  <video id="webcam" autoplay playsinline muted></video>
  <p id="status">Camera not started</p>

  <button onclick="startCamera()">
    Start Front Camera
  </button>

  <script>
    async function startCamera() {
      const status = document.getElementById("status");
      const video = document.getElementById("webcam");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        status.textContent = "Camera Connected Successfully";
      } catch (error) {
        status.textContent =
          "Camera Error: " + error.name + " - " + error.message;
      }
    }
  </script>
</body>
</html>
