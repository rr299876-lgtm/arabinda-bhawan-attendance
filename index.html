
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>ARABINDA BHAWAN Attendance</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f4f8;
      padding: 20px;
    }
    video {
      width: 100%;
      max-width: 420px;
      border-radius: 15px;
      background: black;
    }
    button {
      padding: 16px 25px;
      background: green;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
  
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js"></script>

</head>
<body>
  <h1>ARABINDA BHAWAN</h1>
  <h3>GIRLS STUDENT ATTENDANCE</h3>

  <video id="webcam" autoplay playsinline muted></video>
  
<div style="margin:15px 0;">
  <label for="studentSelect">
    Select Student / छात्रा चुनें
  </label>

  <select id="studentSelect"
          style="width:100%;padding:12px;font-size:18px;">
    <option value="">-- Select Student --</option>
   
<option value="ST001">Student 01</option>
<option value="ST002">Student 02</option>
<option value="ST003">Student 03</option>
<option value="ST004">Student 04</option>
<option value="ST005">Student 05</option>
<option value="ST006">Student 06</option>
<option value="ST007">Student 07</option>
<option value="ST008">Student 08</option>
<option value="ST009">Student 09</option>
<option value="ST010">Student 10</option>
<option value="ST011">Student 11</option>
<option value="ST012">Student 12</option>

  </select>
</div>

<div style="margin-top:20px;">
  <button type="button" onclick="testAttendance('IN')">
    IN
  </button>

  <button type="button" onclick="testAttendance('OUT')">
    OUT
  </button>
</div>

  <p id="status">Camera not started</p>

<div id="attendanceMessage"
     role="status"
     aria-live="polite"
     style="
       margin-top:20px;
       padding:20px;
       border-radius:12px;
       background:#eeeeee;
       color:#222222;
       font-size:24px;
       font-weight:bold;
       text-align:center;
     ">
  ATTENDANCE STATUS
  <div style="font-size:20px; margin-top:8px;">
    उपस्थिति की स्थिति
  </div>
</div>

  <button onclick="startCamera()">
    Start Front Camera
  </button>

  <script>
    let singleFaceReady = false;
    async function startCamera() {
      const status = document.getElementById("status");
      const video = document.getElementById("webcam");

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user" },
          audio: false
        });

        video.srcObject = stream;
        await video.play();
        await startFaceDetection();
        status.textContent = "Camera Connected Successfully";
       
      } catch (error) {
        status.textContent =
          "Camera Error: " + error.name + " - " + error.message;
      }
    }
    
function checkFaceDetection() {
  const video = document.getElementById("webcam");

  if (video && video.readyState >= 2) {
    document.getElementById("status").textContent =
      "Camera Ready - Face Detection Setup Pending";
  }
}

async function detectFaceSupport() {
  const status = document.getElementById("status");

  if ("FaceDetector" in window) {
    status.textContent = "Face Detection API Available";
  } else {
    status.textContent =
      "Face Detection API Not Available - Library Required";
  }
}

let faceDetector = null;

async function startFaceDetection() {
  const status = document.getElementById("status");

  if (typeof FaceDetection === "undefined") {
    status.textContent = "Face Detection Library Not Loaded";
    return;
  }

  try {
    faceDetector = new FaceDetection({
      locateFile: (file) =>
        "https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/" + file
    });

    faceDetector.setOptions({
      model: "short",
      minDetectionConfidence: 0.6
    });



    faceDetector.onResults((results) => {
    
const faceCount = results.detections
  ? results.detections.length
  : 0;


if (faceCount === 1) {
  singleFaceReady = true;
  status.textContent = "One Face Detected - Ready";
} else if (faceCount > 1) {
  singleFaceReady = false;
  status.textContent = "Multiple Faces Detected - Wait";
} else {
  singleFaceReady = false;
  status.textContent = "No Face Detected";
}


    });

    status.textContent = "Face Detector Initialized";
    const video = document.getElementById("webcam");

async function detectFrame() {
  if (!faceDetector || video.readyState < 2) {
    return;
  }

  try {
    await faceDetector.send({ image: video });
  } catch (error) {
    status.textContent = "Detection Error: " + error.message;
    return;
  }

  setTimeout(detectFrame, 250);
}

detectFrame();
  } catch (error) {
    status.textContent = "Face Detector Error: " + error.message;
  }
}


const studentAttendance = {};

function speakMessage(englishText, hindiText) {
  if (!("speechSynthesis" in window)) {
    return;
  }

  window.speechSynthesis.cancel();

  const englishVoice = new SpeechSynthesisUtterance(englishText);
  englishVoice.lang = "en-IN";
  englishVoice.rate = 0.9;

  const hindiVoice = new SpeechSynthesisUtterance(hindiText);
  hindiVoice.lang = "hi-IN";
  hindiVoice.rate = 0.9;

  englishVoice.onend = function() {
    window.speechSynthesis.speak(hindiVoice);
  };

  window.speechSynthesis.speak(englishVoice);
}


function testAttendance(type) {
  const studentId = document.getElementById("studentSelect").value;

if (!studentId) {
  alert("Please select a student first.");
  return;
}

let lastAttendanceType = studentAttendance[studentId] || "IN";
  if (!singleFaceReady) {
    
const warningBox = document.getElementById("attendanceMessage");

if (warningBox) {
  warningBox.style.backgroundColor = "#f8d7da";
  warningBox.style.color = "#721c24";

  warningBox.innerHTML =
    "PLEASE SHOW EXACTLY ONE FACE" +
    "<div>कृपया कैमरे के सामने केवल एक चेहरा दिखाएँ।</div>";
}

    speakMessage(
      "Please show your face to the camera.",
      "कृपया कैमरे के सामने अपना चेहरा दिखाएँ।"
    );
    return;
  }

  if (type === lastAttendanceType) {
    const nextType = lastAttendanceType === "IN" ? "OUT" : "IN";

    alert("Invalid Sequence! Please select " + nextType);

    speakMessage(
      "Invalid attendance. Please select " + nextType,
      "गलत अटेंडेंस। कृपया " +
      (nextType === "OUT" ? "आउट" : "इन") + " बटन दबाएँ।"
    );
    return;
  }

 studentAttendance[studentId] = type;

const messageBox = document.getElementById("attendanceMessage");
alert("Message Box Found: " + (messageBox !== null));
if (messageBox) {
  messageBox.style.backgroundColor = "#d4edda";
  messageBox.style.color = "#155724";

  messageBox.innerHTML = type === "OUT"
    ? "OUT ATTENDANCE SUCCESSFUL<div>आपकी आउट अटेंडेंस सफल हुई।</div>"
    : "IN ATTENDANCE SUCCESSFUL<div>आपकी इन अटेंडेंस सफल हुई।</div>";
}

  

  speakMessage(
    type === "OUT"
      ? "Out attendance successful."
      : "In attendance successful.",
    type === "OUT"
      ? "आपकी आउट अटेंडेंस सफल हुई।"
      : "आपकी इन अटेंडेंस सफल हुई।"
  );
}



  </script>
</body>
</html>
